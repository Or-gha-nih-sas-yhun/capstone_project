# ──────────────────────────────────────────────────────────────────────────
# Barangay branding for the resident app.
#
# These are the ONLY values that need changing to build this app for a
# different barangay. Replace them, swap the launcher icon under
# app/src/main/res/mipmap-*/, then run:  gradlew assembleRelease
# ──────────────────────────────────────────────────────────────────────────

# Name shown under the launcher icon.
brgyAppName=Pili Resident Portal

# Gradle project name (affects the generated APK filename only).
brgyProjectName=BarangayPiliResidentPortal

# Package name that identifies the app on the device and in the Play Store.
# Changing this makes it a SEPARATE app: residents with the old one
# installed would not receive it as an update. Keep it unless this is a
# fresh deployment for a different barangay.
brgyApplicationId=com.barangaypili.residentportal

# Root URL of the deployed web portal. Must end with a slash.
brgyPortalUrl=https://brgypilieclearance.com/

# Token appended to the WebView User-Agent so the server can tell this app
# apart from an ordinary browser. Must match MOBILE_UA_TOKEN in the Laravel
# .env file. The server also accepts the legacy value "BrgyPiliApp".
brgyUaToken=BrgyPiliApp

# ── Standard Android/Gradle settings ────────────────────────────────────
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
